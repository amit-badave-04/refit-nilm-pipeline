[build-system]
requires = ["setuptools>=77"]  # SPDX licence expressions and license-files
build-backend = "setuptools.build_meta"

[project]
name = "refit-nilm"
version = "0.1.0"
description = "Cleaning, EDA and washing-machine disaggregation on the REFIT dataset"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Amit Badave" }]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
