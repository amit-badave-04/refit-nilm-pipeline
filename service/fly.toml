# Fly.io deployment of the washing-machine disaggregation API.
# Deploy from this folder:  flyctl apps create refit-wm-nilm  then  flyctl deploy
app = "refit-wm-nilm"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  RATE_LIMIT_PER_MIN = "30"
  MAX_BODY_BYTES = "2000000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
