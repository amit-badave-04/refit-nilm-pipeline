# Fly.io deployment of the washing-machine disaggregation API.
# Deploy from this folder:  flyctl apps create refit-wm-nilm  then  flyctl deploy
app = "refit-wm-nilm"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  RATE_LIMIT_PER_MIN = "30"
  MAX_POINTS = "2880"
  ORT_THREADS = "1"
  MAX_BODY_BYTES = "2000000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Inference is CPU-bound on one core: beyond two requests in flight the proxy prefers (and starts)
  # the second machine, and it never sends a machine more than four at once.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 4

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# A dedicated core: a shared core's CPU share is throttled under sustained load. Billed only while
# running (machines auto-stop when idle); performance VMs need at least 2 GB.
[[vm]]
  size = "performance-1x"
  memory = "2gb"
